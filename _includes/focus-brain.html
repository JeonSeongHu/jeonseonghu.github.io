{%- comment -%}
  Side view of a brain (facing left) in a 120 x 96 box, as SVG content without the
  outer <svg>, so the Focus hub and the phone drawing can share it.
  Three regions are tinted; CSS (.rg--plan / .rg--talk / .rg--predict) colours them:
    plan     prefrontal cortex, front of the frontal lobe
    talk     language areas: Broca (front end of the lateral sulcus), Wernicke
             (back end), joined by the arcuate fasciculus (dotted)
    predict  cerebellum
  include.id: prefix for the clip-path id (must be unique per page).
{%- endcomment -%}
{%- assign cer = "M14 44 C 9.5 31, 17 14.5, 35 10 C 51 4.5, 75 4.5, 90 12 C 102 18, 108.5 30, 106 42 C 104.8 49.5, 98 54, 90 53 C 84 52.4, 78 54, 72 57.5 C 64 62.5, 50.5 64.5, 40.5 60.5 C 33.5 57.5, 31.5 50.5, 36 47 C 29.5 48.3, 19.5 49.5, 14 44 Z" -%}

<g class="br-base"><path d="{{ cbl }}"/><path d="{{ cer }}"/></g>
<g class="rg rg--predict"><path d="{{ cbl }}"/></g>
<g class="rg rg--plan"><path clip-path="url(#{{ include.id }}-cer)" d="M0 0 H44 C 42 13, 40.5 22, 37.5 30 C 35.5 35, 33 40, 31 46 L 0 46 Z"/></g>
<g class="rg rg--talk">
