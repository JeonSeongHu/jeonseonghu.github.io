{%- comment -%}
  Plans / predictions loop between the two Focus panels. Two drawings: a horizontal
  one for side-by-side panels and a vertical one for stacked panels (CSS shows one).
  A small dot travels the loop (disabled for prefers-reduced-motion).
{%- endcomment -%}
<div class="pf-loop" aria-hidden="true">
  <span class="pf-loop-label pf-loop-label--plans">plans</span>
  <svg class="pf-loop-svg pf-loop-svg--h" viewBox="0 0 128 72" fill="none">
    <path class="arc arc--plans" d="M10 30 C 34 4, 94 4, 116 28"/>
    <path class="head head--plans" d="M119.5 32.5 L110.2 29.9 L116.6 23.6 Z"/>
    <path class="arc arc--pred" d="M118 42 C 94 68, 34 68, 12 44"/>
    <path class="head head--pred" d="M8.5 39.5 L17.8 42.1 L11.4 48.4 Z"/>
    <circle class="end end--plans" cx="10" cy="30" r="2.5"/>
    <circle class="end end--pred" cx="118" cy="42" r="2.5"/>
    <circle class="runner" r="2.6"><animateMotion dur="6s" repeatCount="indefinite" path="M10 30 C 34 4, 94 4, 116 28 C 120 34, 120 38, 118 42 C 94 68, 34 68, 12 44 C 8 40, 8 34, 10 30 Z"/></circle>
  </svg>
  <svg class="pf-loop-svg pf-loop-svg--v" viewBox="0 0 72 110" fill="none">
    <path class="arc arc--plans" d="M36 10 C 70 30, 70 80, 38 99"/>
    <path class="head head--plans" d="M37 100 L41.9 92.5 L45.9 99.3 Z"/>
    <path class="arc arc--pred" d="M36 100 C 2 80, 2 30, 34 11"/>
    <path class="head head--pred" d="M35 10.5 L30.1 18 L26.1 11.2 Z"/>
  </svg>
  <span class="pf-loop-label pf-loop-label--pred">predictions</span>
</div>
